version: '2.1'
rules:
  - id: "1"
    name: rule1-signed-lower-equal
    tags:
      type: flow1
      category: category
    conditions:
      - operator: lower_equal
        parameters:
          inputs:
            - address: rule1-input
          type: signed
          value: -42
  - id: "2"
    name: rule2-unsigned-lower-equal
    tags:
      type: flow1
      category: category
    conditions:
      - operator: lower_equal
        parameters:
          inputs:
            - address: rule2-input
          type: unsigned
          value: 42
  - id: "3"
    name: rule3-float-lower-equal
    tags:
      type: flow1
      category: category
    conditions:
      - operator: lower_equal
        parameters:
          inputs:
            - address: rule3-input
          type: float
          value: 4.2
  - id: "4"
    name: rule4-signed-lower-equal-with-string-conversion
    tags:
      type: flow1
      category: category
    conditions:
      - operator: lower_equal
        parameters:
          inputs:
            - address: rule4-input
          type: signed
          value: 100
          options:
            convert_strings: true
