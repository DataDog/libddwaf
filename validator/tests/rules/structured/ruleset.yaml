version: "2.2"
metadata:
  rules_version: 1.8.0
rules:
  - id: rsp-930-001
    name: LFI Exploit detection
    tags:
      type: lfi
      category: exploit_detection
      module: rasp
    conditions:
      - parameters:
          resource:
            - address: server.io.fs.file
          params:
            - address: server.request.query
            - address: server.request.body
            - address: server.request.path_params
            - address: grpc.server.request.message
            - address: graphql.server.all_resolvers
            - address: graphql.server.resolver
        operator: lfi_detector@v2
  - id: rsp-930-002
    name: SSRF Exploit detection
    tags:
      type: ssrf
      category: exploit_detection
      module: rasp
    conditions:
      - parameters:
          resource:
            - address: server.io.net.url
          params:
            - address: server.request.query
            - address: server.request.body
            - address: server.request.path_params
            - address: grpc.server.request.message
            - address: graphql.server.all_resolvers
            - address: graphql.server.resolver
        operator: ssrf_detector@v1
  - id: rsp-930-003
    name: SQLi Exploit detection
    tags:
      type: sqli
      category: exploit_detection
      module: rasp
    conditions:
      - parameters:
          resource:
            - address: server.db.statement
          params:
            - address: server.request.query
            - address: server.request.body
            - address: server.request.path_params
            - address: grpc.server.request.message
            - address: graphql.server.all_resolvers
            - address: graphql.server.resolver
          db_type:
            - address: server.db.system
        operator: sqli_detector@v2
  - id: rsp-930-004
    name: SHi Exploit detection
    tags:
      type: shi
      category: exploit_detection
      module: rasp
    conditions:
      - parameters:
          resource:
            - address: server.sys.shell.cmd
          params:
            - address: server.request.query
            - address: server.request.body
            - address: server.request.path_params
            - address: grpc.server.request.message
            - address: graphql.server.all_resolvers
            - address: graphql.server.resolver
        operator: shi_detector@v1
  - id: rsp-930-005
    name: CMDi Exploit detection
    tags:
      type: cmdi
      category: exploit_detection
      module: rasp
    conditions:
      - parameters:
          resource:
            - address: server.sys.exec.cmd
          params:
            - address: server.request.query
            - address: server.request.body
            - address: server.request.path_params
            - address: grpc.server.request.message
            - address: graphql.server.all_resolvers
            - address: graphql.server.resolver
        operator: cmdi_detector@v1
  # The rules below mirror the ones above, but apply transformers to one of the
  # parameter addresses. They rely on parameter addresses which aren't used by
  # any of the rules above so that both sets can be tested independently.
  - id: rsp-931-001
    name: LFI Exploit detection with transformers
    tags:
      type: lfi
      category: exploit_detection
      module: rasp
    conditions:
      - parameters:
          resource:
            - address: server.io.fs.file
          params:
            - address: server.request.cookies
              transformers:
                - url_decode
            - address: server.request.trailers
              transformers:
                - base64_decode
            - address: server.request.headers.no_cookies
        operator: lfi_detector@v2
  - id: rsp-931-002
    name: SSRF Exploit detection with transformers
    tags:
      type: ssrf
      category: exploit_detection
      module: rasp
    conditions:
      - parameters:
          resource:
            - address: server.io.net.url
          params:
            - address: server.request.cookies
              transformers:
                - url_decode
            - address: server.request.trailers
              transformers:
                - base64_decode
            - address: server.request.headers.no_cookies
        operator: ssrf_detector@v1
  - id: rsp-931-003
    name: SQLi Exploit detection with transformers
    tags:
      type: sqli
      category: exploit_detection
      module: rasp
    conditions:
      - parameters:
          resource:
            - address: server.db.statement
          params:
            - address: server.request.cookies
              transformers:
                - url_decode
            - address: server.request.trailers
              transformers:
                - base64_decode
            - address: server.request.headers.no_cookies
          db_type:
            - address: server.db.system
        operator: sqli_detector@v2
  - id: rsp-931-004
    name: SHi Exploit detection with transformers
    tags:
      type: shi
      category: exploit_detection
      module: rasp
    conditions:
      - parameters:
          resource:
            - address: server.sys.shell.cmd
          params:
            - address: server.request.cookies
              transformers:
                - base64_decode
                - url_decode
            - address: server.request.trailers
              transformers:
                - base64_decode
            - address: server.request.headers.no_cookies
        operator: shi_detector@v1
  - id: rsp-931-005
    name: CMDi Exploit detection with transformers
    tags:
      type: cmdi
      category: exploit_detection
      module: rasp
    conditions:
      - parameters:
          resource:
            - address: server.sys.exec.cmd
          params:
            - address: server.request.cookies
              transformers:
                - url_decode
            - address: server.request.trailers
              transformers:
                - base64_decode
            - address: server.request.headers.no_cookies
        operator: cmdi_detector@v1
