{
  name: "CMDi match on a url-encoded parameter",
  runs: [
    {
      input: {
        server.sys.exec.cmd: [ "/bin/sh", "-c", "ls -l" ],
        server.request.cookies: { cmd: "ls%20-l" }
      },
      rules: [
        {
          "rsp-931-005": [
            {
              resource: {
                address: "server.sys.exec.cmd",
                value: "/bin/sh \"-c\" \"ls -l\""
              },
              params: {
                address: "server.request.cookies",
                key_path: [ "cmd" ],
                value: "ls -l"
              }
            }
          ]
        }
      ],
      code: match
    }
  ]
}
