# Publish libddwaf-src using crates.io trusted publishing (OIDC).
#
# The first version must be published with a short-lived crates.io token. After
# that, configure the crate's trusted publisher with:
#   Owner: DataDog
#   Repository: libddwaf
#   Workflow: publish.yml
#   Environment: crates-io

name: Publish Cargo crate

on:
  release:
    types: [published]

concurrency:
  group: crates-io
  cancel-in-progress: false

jobs:
  publish:
    name: Publish libddwaf-src
    runs-on: ubuntu-24.04
    environment:
      name: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ make

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#v}"
          crate_version="$(cargo +1.85.0 metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "libddwaf-src") | .version')"

          if [[ "$tag_version" != "$crate_version" ]]; then
            echo "::error::tag version $tag_version does not match crate version $crate_version"
            exit 1
          fi

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@b7e9a28eded4986ec6b1fa40eeee8f8f165559ec # v1

      - name: Publish libddwaf-src
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo +1.85.0 publish > publish.log 2>&1 \
            || grep -q "already exists" publish.log \
            || { cat publish.log; exit 1; }
          cat publish.log
